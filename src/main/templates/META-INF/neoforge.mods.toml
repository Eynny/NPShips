# NPShips metadata; inherited MDK portions retain TEMPLATE_LICENSE.txt.
modLoader="javafml"
loaderVersion="${loader_version_range}"
# MIT covers original NPShips code/owned resources, not independent third parties.
# See META-INF/NPShipsThirdPartyNotices.md and the retained license texts.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="npships.mixins.json"

# Owner-requested minimum runtime versions; build inputs remain pinned separately.
# Newer native versions need actual compatibility verification, including Ponder Mixins.
[[dependencies.npships]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.npships]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.npships]]
modId="create"
type="required"
versionRange="[6.0.10,)"
ordering="NONE"
side="BOTH"

[[dependencies.npships]]
modId="ponder"
type="required"
versionRange="[1.0.82+mc1.21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.npships]]
modId="flywheel"
type="required"
versionRange="[1.0.6,)"
ordering="NONE"
side="BOTH"

[[dependencies.npships]]
modId="sable"
type="required"
versionRange="[2.0.6,)"
ordering="AFTER"
side="BOTH"

[[dependencies.npships]]
modId="sablecompanion"
type="required"
versionRange="[1.6.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.npships]]
modId="aeronautics"
type="optional"
versionRange="[1.3.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.npships]]
modId="simulated"
type="optional"
versionRange="[1.3.2,)"
ordering="AFTER"
side="BOTH"

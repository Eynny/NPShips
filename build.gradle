plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {

    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup "cc.tweaked" }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }

    maven {
        url = "https://maven.caffeinemc.net/releases"
        content { includeGroup "net.caffeinemc" }
    }

    mavenCentral()


    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }


    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }


    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }

}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The API subproject compiles the exact public source slice once. These classes are
// embedded in this normal mod, not installed as a second API mod at runtime.
evaluationDependsOn(':npships-api')
def apiProject = project(':npships-api')
sourceSets.main.java {
    exclude('com/eynny/npships/api/**')
    exclude('com/eynny/npships/config/RarityParameters.java')
    exclude('com/eynny/npships/config/WeatherRule.java')
}
dependencies {
    compileOnly(project(':npships-api')) {
        attributes { attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR)) }
    }
}
tasks.named('jar', Jar) { from(apiProject.sourceSets.main.output) }

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            systemProperty 'npships.profileEditor', providers.gradleProperty('npshipsEditorProfiling').getOrElse('false')

        }

        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(apiProject.sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

apply from: 'gradle/dependency-integrity.gradle'

dependencies {

    // Development runtime only: no published or mandatory NPShips dependency.
    // Disable with -PnpshipsIntegrationMods=false to test the base installation.
    if (providers.gradleProperty('npshipsIntegrationMods').getOrElse('false').toBoolean()) {
        localRuntime("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}") { transitive = false }
        localRuntime("maven.modrinth:create-radars:${radars_version_id}") { transitive = false }
        // Required by Radars, and in turn by Big Cannons.
        localRuntime("maven.modrinth:create-big-cannons:${cbc_version_id}") { transitive = false }
        localRuntime("maven.modrinth:rpl:${rpl_version_id}") { transitive = false }
        // Temporary item/recipe browser for development; never exported or embedded.
        if (providers.gradleProperty('npshipsJei').getOrElse('false').toBoolean()) {
            localRuntime("maven.modrinth:jei:${jei_version_id}") { transitive = false }
            localRuntime("maven.modrinth:mezzconfig:${mezzconfig_version_id}") { transitive = false }
        }
    }

    // External compatibility development only; never a required NPShips mod dependency.
    if (providers.gradleProperty('npshipsDeepSeas').getOrElse('false').toBoolean()) {
        localRuntime("maven.modrinth:create-deep-seas:${deep_seas_version_id}") { transitive = false }
        // Keep the distribution shell on ModDevGradle's library classpath so it cannot
        // shadow its same-ID mod. The mod artifact is byte-identical to its nested JAR.
        additionalRuntimeClasspath("maven.modrinth:sodium:7XOIgnrf") { transitive = false }
        localRuntime("net.caffeinemc:sodium-neoforge-mod:${sodium_version}") { transitive = false }
    }

    implementation "net.neoforged:neoforge:${neo_version}"


    // Create
    implementation(
            "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    ) {
        transitive = false
    }


    implementation(
            "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    )


    compileOnly(
            "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    )


    runtimeOnly(
            "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    )


    // Exact public artifacts, byte-equal to the retained local reference JARs.
    implementation('maven.modrinth:sable:fg9dTRz9') { transitive = false }
    compileOnly('maven.modrinth:create-aeronautics:44pLdPGg') { transitive = false }
    if (providers.gradleProperty('npshipsAeronautics').getOrElse('true').toBoolean()) {
        localRuntime('maven.modrinth:create-aeronautics:44pLdPGg') { transitive = false }
        runtimeOnly files(npshipsLocalDependencies.findAll { it.name.startsWith('simulated-') })
    }
    // Exact Simulated/Companion compile inputs still require explicit provisioning.
    implementation files(npshipsLocalDependencies.findAll { !it.name.startsWith('simulated-') })
    compileOnly files(npshipsLocalDependencies.findAll { it.name.startsWith('simulated-') })


    implementation(
            "com.tterrag.registrate:Registrate:${registrate_version}"
    )
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            neo_version_range      : neo_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('local-maven').get().asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

java {

    withSourcesJar()

}
tasks.named('sourcesJar', Jar) { from(apiProject.sourceSets.main.allSource) }

// Package production sources/resources and retain their independent notices.
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    from(project.files('LICENSE', 'TEMPLATE_LICENSE.txt')) { spec -> spec.into('META-INF') }
    from(project.file('NPShipsThirdPartyNotices.md')) { spec -> spec.into('META-INF') }
    from(project.file('licenses')) { spec -> spec.into('META-INF/licenses') }
    exclude('src/gameTest/**', 'src/developmentTest/**', 'docs/**', '_local_archive/**', '**/.cache/**')
}

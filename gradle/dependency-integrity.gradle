// Exact reviewed inputs, not permission to redistribute third-party binaries.

def integrityFile = file('gradle/dependency-integrity.json')
def integrity = new groovy.json.JsonSlurper().parse(integrityFile)
def simulated = integrity.generated.simulated
def bundlePin = integrity.maven.find { it.module == simulated.sourceModule }
if (bundlePin == null) throw new GradleException('Missing reviewed source bundle pin for generated Simulated input.')

def digestOf = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}

def verifyInput = { File input, expected, String label ->
    if (!input.isFile()) throw new GradleException("Missing ${label}: ${input}")
    if (expected.bytes != null && input.length() != expected.bytes) {
        throw new GradleException("Size mismatch for ${label}: ${input.length()} bytes, expected ${expected.bytes}.")
    }
    def actual = digestOf(input)
    if (actual != expected.sha256) {
        throw new GradleException("SHA-256 mismatch for ${label}: ${actual}, expected ${expected.sha256}. Use the exact reviewed public artifact, not another build of the same version.")
    }
}

// This configuration obtains an input archive only. It never extends a runtime classpath.
def bundleInput = configurations.create('npshipsAeronauticsBundleInput') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
    visible = false
    description = 'Pinned official archive containing the reviewed Simulated compile input.'
}
dependencies.add(bundleInput.name, simulated.sourceModule) { transitive = false }

def simulatedOutput = layout.buildDirectory.file('generated/dependency-inputs/' + simulated.file)
def prepareSimulated = tasks.register('prepareSimulatedDependency') {
    group = 'build setup'
    description = 'Extract and verify the exact reviewed Simulated JAR from the official pinned bundle.'
    inputs.files(bundleInput).withPropertyName('aeronauticsBundle').withPathSensitivity(PathSensitivity.NONE)
    inputs.properties([
        sourceModule: simulated.sourceModule,
        sourceEntry: simulated.sourceEntry,
        sourceSha256: bundlePin.sha256,
        sourceBytes: bundlePin.bytes,
        outputSha256: simulated.sha256,
        outputBytes: simulated.bytes
    ])
    outputs.file(simulatedOutput).withPropertyName('simulatedJar')
    doLast {
        def bundle = bundleInput.singleFile
        verifyInput(bundle, bundlePin, simulated.sourceModule)
        def staged = new File(temporaryDir, simulated.file)
        staged.parentFile.mkdirs()
        new java.util.zip.ZipFile(bundle).withCloseable { archive ->
            def entry = archive.getEntry(simulated.sourceEntry)
            if (entry == null || entry.directory || entry.size != simulated.bytes) {
                throw new GradleException("Missing or mismatched nested Simulated entry: ${simulated.sourceEntry}")
            }
            archive.getInputStream(entry).withCloseable { stream ->
                staged.withOutputStream { output -> output << stream }
            }
        }
        verifyInput(staged, simulated, 'nested Simulated input')
        def output = simulatedOutput.get().asFile
        output.parentFile.mkdirs()
        java.nio.file.Files.move(staged.toPath(), output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle('Prepared reviewed Simulated input: {} SHA-256 {}', output, simulated.sha256)
    }
}

// FileCollection retains the producer dependency for compilation, Javadoc, IDE and dev runtime.
ext.npshipsSimulatedDependency = files(simulatedOutput).builtBy(prepareSimulated)

def verifyIntegrity = tasks.register('verifyDependencyIntegrity') {
    group = 'verification'
    description = 'Verify reviewed public Maven artifacts and the generated Simulated input.'
    dependsOn(prepareSimulated)
    inputs.file(integrityFile)
    // No outputs: recheck the current source and generated bytes on every invocation,
    // even if extraction and compilation are otherwise UP-TO-DATE.
    doLast {
        verifyInput(bundleInput.singleFile, bundlePin, simulated.sourceModule)
        verifyInput(simulatedOutput.get().asFile, simulated, 'generated Simulated input')
        def resolved = [configurations.compileClasspath, configurations.runtimeClasspath,
                        configurations.additionalRuntimeClasspath, bundleInput].collectMany {
            it.resolvedConfiguration.resolvedArtifacts.toList()
        }.unique { it.file.canonicalPath }
        def found = [] as Set
        resolved.each { artifact ->
            def module = artifact.moduleVersion.id.toString()
            def expected = integrity.maven.find { it.module == module }
            def reviewedModule = integrity.maven.find {
                it.module.substring(0, it.module.lastIndexOf(':')) == artifact.moduleVersion.id.group + ':' + artifact.moduleVersion.id.name
            }
            if (reviewedModule != null && expected == null) {
                throw new GradleException("Unreviewed version ${module}; expected ${reviewedModule.module}. Update versions and integrity pins only after explicit review.")
            }
            if (expected != null) {
                verifyInput(artifact.file, expected, module)
                found.add(module)
                logger.lifecycle('Verified Maven input: {} SHA-256 {}', module, expected.sha256)
            }
        }
        def required = integrity.maven.findAll {
            !it.module.startsWith('maven.modrinth:jei:') && !it.module.startsWith('maven.modrinth:mezzconfig:') &&
                !it.module.startsWith('cc.tweaked:') && !it.module.startsWith('maven.modrinth:create-radars:') &&
                !it.module.startsWith('maven.modrinth:create-big-cannons:') && !it.module.startsWith('maven.modrinth:rpl:') &&
                (!(it.module.startsWith('maven.modrinth:create-deep-seas:') || it.module.startsWith('maven.modrinth:sodium:') || it.module.startsWith('net.caffeinemc:sodium-neoforge-mod:')) || providers.gradleProperty('npshipsDeepSeas').getOrElse('false').toBoolean())
        }.collect { it.module }
        def missing = required.findAll { !found.contains(it) }
        if (!missing.empty) throw new GradleException('Reviewed required Maven modules missing from classpaths: ' + missing)
    }
}

tasks.withType(JavaCompile).configureEach { dependsOn(verifyIntegrity) }
tasks.withType(Javadoc).configureEach { dependsOn(verifyIntegrity) }
tasks.named('check') { dependsOn(verifyIntegrity) }
